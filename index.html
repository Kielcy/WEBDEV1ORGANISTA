<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listahan ng Utang | Solo Leveling</title>
    <link rel="stylesheet" href="/CSS/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LISTAHAN NG UTANG</h1>
            <p class="subtitle">Track mga utang para hindi malimutan</p>
        </header>
        
        <div class="input-container">
            <div class="form-group">
                <div class="input-group">
                    <label for="name">Pangalan:</label>
                    <input type="text" id="name" placeholder="Pangalan ng nangutang">
                    <div id="nameError" class="error"></div>
                </div>
                
                <div class="input-group">
                    <label for="amount">Halaga (₱):</label>
                    <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
                    <div id="amountError" class="error"></div>
                </div>
            </div>
            
            <div class="button-wrapper">
                <button id="saveButton">I-SAVE ANG UTANG</button>
            </div>
        </div>
        
        <div class="utang-list">
            <h2>MGA NAKAUTANG</h2>
            <ul id="nakautangs">
                <li class="empty-list" id="emptyList">Walang mga utang na naka-record</li>
            </ul>
        </div>
        
        <div class="footer">
            &copy; 2025 Listahan ng Utang System | Solo Leveling Theme
        </div>
    </div>

    <script src="/JS/script.js"></script>
</body>
</html>
